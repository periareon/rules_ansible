---
- name: Install nginx
  ansible.builtin.dnf: # noqa: package-latest
    name:
      - nginx
      - nginx-mod-stream
    state: latest

- name: Create a shared config directory
  ansible.builtin.file:
    name: "{{ item }}"
    state: directory
    mode: "0755"
    group: root
    owner: root
  loop:
    - /etc/nginx/conf.d/stream
    - /etc/nginx/conf.d/http

# The test containers have no init system so nginx is never started, the
# config is validated in place instead.
- name: Install primary nginx config
  ansible.builtin.copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nginx -t -c %s
