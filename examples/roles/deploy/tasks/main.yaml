---
- name: Create the deploy directory
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: "0755"

- name: Install the application config built by Bazel
  ansible.builtin.copy:
    src: app.conf
    dest: "{{ deploy_dir }}/app.conf"
    mode: "0644"

- name: Install the build info generated by Bazel
  ansible.builtin.copy:
    src: build_info.txt
    dest: "{{ deploy_dir }}/build_info.txt"
    mode: "0644"
